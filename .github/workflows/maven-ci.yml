name: Maven Multi-Service Docker CI/CD # 工作流的名称，便于在 GitHub Actions 页面中查看。

on:
  push:
    branches:
      - main # 只有 main 分支的推送事件会触发工作流
  #pull_request:
   # branches:
    #  - main

env:
  REGISTRY: ghcr.io # 使用 GitHub 容器注册表（GitHub Container Registry）
  IMAGE_OWNER: ${{ github.repository_owner }} #镜像所有者（一般是当前仓库所属用户或组织）
  IMAGE_TAG: latest # 使用固定标签以覆盖旧镜像
  PROFILE: test  # Spring Boot 的激活环境，用于容器部署时传参

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # CI运行环境使用 GitHub 托管的 Ubuntu，并拥有读取代码、写入容器注册表的权限。

    steps:
      - name: 检出代码
        uses: actions/checkout@v4 #	使用官方 Action 将仓库代码拉取到 runner 中。

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven # 使用 Temurin 分发版配置 Java 17，并开启 Maven 缓存。

      - name: 构建所有服务
        run: mvn -B package --file pom.xml -Dmaven.test.skip=true # 使用 mvn package 编译打包所有服务，跳过测试。

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3 # 启用 Buildx 插件，支持多平台构建和缓存。

      - name: 登录 GitHub 容器注册表
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 使用 GitHub Token 登录 ghcr.io 注册表。

      - name: 构建并推送 Gateway Docker 镜像 # 该步骤显示的名称
        uses: docker/build-push-action@v5 # 使用 Docker 官方的构建与推送镜像插件
        with:
          context: gateway/ # 执行Docker build时的路径
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloud-demo/gateway:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=gateway-build
          cache-to: type=gha,scope=gateway-build,mode=max

      - name: 构建并推送 Service Order Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: services/service-order/
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloud-demo/service-order:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=service-order-build
          cache-to: type=gha,scope=service-order-build,mode=max # 对每个服务分别构建并推送镜像（gateway、order、product），使用缓存提升效率。

      - name: 构建并推送 Service Product Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: services/service-product/
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloud-demo/service-product:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=service-product-build
          cache-to: type=gha,scope=service-product-build,mode=max

  deploy-gateway:
    needs: build # 表示必须等待 build 作业完成
    runs-on: self-hosted # 使用你自托管的机器（必须提前配置 runner）
    if: github.event_name == 'push' # 仅当 push 事件触发时执行（防止手动触发或 PR 执行）
    permissions:
      contents: read
      packages: read

    steps:
      - name: 登录 GitHub 容器注册表
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 调试：检查环境和保存脚本
        shell: pwsh
        run: |
          Write-Host "工作目录: $PWD"
          Write-Host "PowerShell 版本: $($PSVersionTable.PSVersion)"
          

      - name: 拉取并运行 Gateway Docker 镜像
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $IMAGE_TAG = "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloud-demo/gateway:${{ env.IMAGE_TAG }}"
          $CONTAINER_NAME = "service-gateway"
          $PORT_MAP = "80:80"

          Write-Host "--- 部署 Gateway ---"
          Write-Host "镜像: $IMAGE_TAG"
          Write-Host "容器: $CONTAINER_NAME"
          Write-Host "端口: $PORT_MAP"
          
          Write-Host "清理历史镜像..."
          try {
            docker stop $CONTAINER_NAME
            Write-Host "容器已停止"
          } catch {
            Write-Host "⚠️ 容器停止失败或不存在：$($_.Exception.Message)"
          }
            
          try {
            docker rm $CONTAINER_NAME
            Write-Host "容器已删除"
          } catch {
            Write-Host "⚠️ 容器删除失败或不存在：$($_.Exception.Message)"
          }
            
          try {
            docker rmi "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloud-demo/gateway:${{ env.IMAGE_TAG }}"
            Write-Host "旧镜像已删除"
          } catch {
            Write-Host "⚠️ 删除旧镜像失败或不存在：$($_.Exception.Message)"
          }
          Write-Host "清理历史镜像完成..."

          Write-Host "拉取镜像..."
          docker pull $IMAGE_TAG || { Write-Host "拉取失败"; exit 1 }
          Write-Host "拉取成功"

          Write-Host "检查容器..."
          $containerExists = docker ps -a --filter "name=$CONTAINER_NAME" --format "{{.Names}}"
          if ($containerExists -eq $CONTAINER_NAME) { docker stop $CONTAINER_NAME; docker rm $CONTAINER_NAME } else { Write-Host "容器不存在" }

          Write-Host "运行容器..."
          docker run -d `
          --name $CONTAINER_NAME `
          -p $PORT_MAP `
          -e "SPRING_PROFILES_ACTIVE=${{ env.PROFILE }}" `
          --restart unless-stopped `
          $IMAGE_TAG || { echo "启动失败"; exit 1; }
          Write-Host "启动成功"

          Write-Host "检查状态..."
          Start-Sleep -Seconds 10
          $status = docker ps --filter "name=$CONTAINER_NAME" --format "{{.Status}}"
          if ($status -notlike "*Up*") {
            Write-Host "容器未运行，状态: $status"
            Write-Host "容器日志:"
            docker logs $CONTAINER_NAME
            exit 1
          }
          Write-Host "状态: $status"

          Write-Host "清理未使用镜像..."

          Write-Host "--- 部署完成 ---"

  deploy-service-order:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push'
    permissions:
